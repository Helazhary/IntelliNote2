# Render Blueprint — SmartNotes AI backend (Phase 7).
# Render auto-detects this file at the repo root. It provisions a free managed
# Postgres database and a free Python web service for the FastAPI backend.
# Frontend deploys separately to Vercel (see docs/DEPLOYMENT.md).

databases:
  - name: smartnotes-db
    plan: free          # free Postgres (time-limited per Render's current policy)

services:
  - type: web
    name: smartnotes-api
    runtime: python
    plan: free
    rootDir: backend           # build + start commands run from backend/
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh # alembic upgrade head, then uvicorn on $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DATABASE_URL
        fromDatabase:
          name: smartnotes-db
          property: connectionString   # internal Postgres URL, wired automatically
      - key: JWT_SECRET
        generateValue: true            # Render generates a strong random secret
      - key: AI_MODEL_DEFAULT
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false                    # set manually in the dashboard (secret)
      - key: CORS_ORIGINS
        sync: false                    # set to the Vercel frontend URL after step 4
